<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dorum Lifestyle · Hogares inmersos en la naturaleza</title>
<meta name="description" content="Dorum Lifestyle: casas de lago, fincas, lotes con vista al embalse y apartamentos curados en Guatapé, Oriente Antioqueño, Medellín y Cartagena. Sitio generado con Llave OS.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="site.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C2542B'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='18' fill='%23FFFCF5'%3ED%3C/text%3E%3C/svg%3E">
</head>
<body>

<header id="siteHeader"></header>

<!-- Hero -->
<section class="dz-hero" id="inicio">
  <img class="dz-hero-img" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2000&q=80" alt="Embalse de Guatapé al amanecer, con niebla entre las montañas" fetchpriority="high">
  <svg class="dz-hero-topo" viewBox="0 0 600 400" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
    <path d="M40 300c80-60 140-20 220-60s120-100 200-90 120 40 140 80"/>
    <path d="M20 340c90-70 160-30 240-70s130-110 210-100 130 50 150 90"/>
    <path d="M0 380c100-80 180-40 260-80s140-120 220-110 140 60 160 100"/>
    <path d="M80 260c70-50 130-10 200-50s110-90 190-80 110 30 130 70"/>
    <path d="M120 220c60-40 120 0 180-40s100-80 180-70 100 20 120 60"/>
  </svg>
  <div class="container dz-hero-inner">
    <p class="eyebrow" data-i18n="hero.eyebrow"></p>
    <h1 class="display-hero" data-i18n="hero.title"></h1>
    <p class="lead" id="heroLead"></p>
    <div class="dz-hero-ctas">
      <a class="btn btn-accent btn-lg" href="#inmuebles" data-i18n="hero.cta1"></a>
      <a class="btn btn-secondary btn-lg" id="heroWa" href="#" target="_blank" rel="noopener" data-i18n="hero.cta2"></a>
    </div>
    <div class="dz-hero-meta" id="heroMeta"></div>
  </div>
</section>

<!-- Quick search -->
<div class="container dz-search-wrap">
  <form class="card dz-search" id="quickSearch" autocomplete="off">
    <label class="field"><span class="label" data-i18n="search.op"></span>
      <select class="select" id="qOp">
        <option value="buy" data-i18n="search.buy"></option>
        <option value="rent" data-i18n="search.rent"></option>
        <option value="stay" data-i18n="search.stay"></option>
      </select></label>
    <label class="field"><span class="label" data-i18n="search.type"></span><select class="select" id="qType"></select></label>
    <label class="field"><span class="label" data-i18n="search.zone"></span><select class="select" id="qZone"></select></label>
    <label class="field"><span class="label" data-i18n="search.budget"></span><select class="select" id="qBudget"></select></label>
    <button type="submit" class="btn btn-primary" id="qGo"></button>
  </form>
</div>

<!-- Gallery -->
<section class="container section" id="inmuebles">
  <div class="dz-section-head">
    <div>
      <p class="eyebrow" data-i18n="gal.eyebrow"></p>
      <h2 data-i18n="gal.title"></h2>
      <p class="lead" data-i18n="gal.lead"></p>
    </div>
    <span class="dz-count" id="galCount"></span>
  </div>
  <div class="dz-filters">
    <div class="tabs tabs-pill" role="tablist" id="galTabs">
      <button type="button" class="tab is-active" role="tab" data-mode="buy" data-i18n="gal.buy"></button>
      <button type="button" class="tab" role="tab" data-mode="rent" data-i18n="gal.rent"></button>
      <button type="button" class="tab" role="tab" data-mode="stay" data-i18n="gal.stay"></button>
    </div>
    <div class="dz-chips" id="galZones"></div>
  </div>
  <div class="dz-grid" id="galGrid"></div>
</section>

<!-- Collections -->
<section class="band-sand dz-band" id="colecciones">
  <div class="container">
    <div class="dz-section-head">
      <div>
        <p class="eyebrow" data-i18n="col.eyebrow"></p>
        <h2 data-i18n="col.title"></h2>
      </div>
    </div>
    <div id="collections"></div>
  </div>
</section>

<!-- Lifestyle teaser -->
<section class="container section" id="lifestyle">
  <div class="dz-ls">
    <div>
      <p class="eyebrow" data-i18n="ls.eyebrow"></p>
      <h2 class="display" style="font-size:clamp(1.75rem,3.6vw,var(--fs-3xl));font-weight:400;margin-top:var(--s-2)" data-i18n="ls.title"></h2>
      <p class="lead" style="margin-top:var(--s-4)" data-i18n="ls.lead"></p>
      <div class="row" style="margin-top:var(--s-6)">
        <a class="btn btn-primary btn-lg" href="lifestyle.html" data-i18n="ls.cta"></a>
      </div>
    </div>
    <div class="dz-ls-services" id="lsServices"></div>
  </div>
</section>

<!-- Divisions -->
<section class="container section" id="divisiones" style="padding-top:0">
  <div class="dz-section-head">
    <div>
      <p class="eyebrow" data-i18n="div.eyebrow"></p>
      <h2 data-i18n="div.title"></h2>
    </div>
    <p class="lead" id="divTag" style="max-width:36ch;text-align:right"></p>
  </div>
  <div class="dz-divisions" id="divisions"></div>
</section>

<!-- Team -->
<section class="band-sand dz-band" id="nosotros">
  <div class="container">
    <div class="dz-section-head">
      <div>
        <p class="eyebrow" data-i18n="team.eyebrow"></p>
        <h2 data-i18n="team.title"></h2>
      </div>
    </div>
    <div class="dz-team">
      <div class="dz-owner" id="ownerCard"></div>
      <div>
        <div class="dz-brokers" id="brokers"></div>
        <div class="dz-facts">
          <div><h4 data-i18n="team.markets"></h4><ul id="markets"></ul></div>
          <div><h4 data-i18n="team.offices"></h4><ul id="offices"></ul></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Testimonials -->
<section class="container section" id="testimonios">
  <div class="dz-section-head">
    <div>
      <p class="eyebrow" data-i18n="test.eyebrow"></p>
      <h2 data-i18n="test.title"></h2>
    </div>
  </div>
  <div class="dz-testimonials" id="testimonials"></div>
</section>

<!-- Contact -->
<section class="band-sand dz-band" id="contacto">
  <div class="container dz-contact">
    <div>
      <p class="eyebrow" data-i18n="ct.eyebrow"></p>
      <h2 class="display" style="font-size:clamp(1.75rem,3.6vw,var(--fs-3xl));font-weight:400;margin-top:var(--s-2)" data-i18n="ct.title"></h2>
      <p class="lead" style="margin-top:var(--s-4)" data-i18n="ct.lead"></p>
      <div class="row" style="margin-top:var(--s-6)">
        <a class="btn btn-accent" id="contactWa" href="#" target="_blank" rel="noopener" data-i18n="hero.cta2"></a>
      </div>
    </div>
    <form class="card dz-form" id="contactForm">
      <label class="field"><span class="label" data-i18n="ct.name"></span><input class="input" id="cName" required placeholder="Ana María Gómez"></label>
      <label class="field"><span class="label" data-i18n="ct.wa"></span><input class="input" id="cWa" required inputmode="tel" placeholder="+57 300 000 0000"></label>
      <label class="field span-2"><span class="label" data-i18n="ct.interest"></span>
        <select class="select" id="cInterest">
          <option data-i18n="ct.i1"></option><option data-i18n="ct.i2"></option><option data-i18n="ct.i3"></option><option data-i18n="ct.i4"></option><option data-i18n="ct.i5"></option>
        </select></label>
      <button type="submit" class="btn btn-primary btn-lg span-2" data-i18n="ct.send"></button>
      <p class="dz-form-note span-2" id="formNote"></p>
    </form>
  </div>
</section>

<footer id="siteFooter"></footer>

<script src="../assets/data.js"></script>
<script src="../assets/i18n.js"></script>
<script src="site.js"></script>
<script>
(function () {
  var D = window.DORUM, S = window.SITE;
  S.renderChrome({ home: true, active: 'inmuebles' });

  /* ---- hero ---- */
  var waHello = S.wa('Hola Dorum, vi el sitio y quiero conocer inmuebles en Guatapé.');
  document.getElementById('heroWa').href = waHello;
  document.getElementById('contactWa').href = waHello;
  var pub = S.publicListings();
  var zonesCount = {}; pub.forEach(function (l) { zonesCount[S.zoneOf(l)] = 1; });
  function renderHero() {
    var en = S.lang === 'en';
    document.getElementById('heroLead').textContent = en ? D.tenant.positioning : D.tenant.positioningEs;
    document.getElementById('heroMeta').innerHTML =
      '<div><b>' + pub.length + '</b>' + (en ? 'curated properties' : 'inmuebles curados') + '</div>' +
      '<div><b>' + Object.keys(zonesCount).length + '</b>' + (en ? 'areas · Colombia, Mexico' : 'zonas · Colombia, México') + '</div>' +
      '<div><b>' + D.tenant.offices.length + '</b>' + (en ? 'offices' : 'oficinas') + '</div>';
  }

  /* ---- filters state ---- */
  var state = { mode: 'buy', zone: 'all', type: 'all', budget: 'all' };
  var TYPES = ['apartamento', 'casa', 'finca', 'lote', 'penthouse', 'oficina'];
  var BUDGETS = {
    buy: [['all', 'Cualquiera', 'Any'], ['0-1000', 'Hasta $1.000 M', 'Up to $1.000 M'], ['1000-2000', '$1.000 – 2.000 M', '$1.000 – 2.000 M'], ['2000-3500', '$2.000 – 3.500 M', '$2.000 – 3.500 M'], ['3500-', 'Más de $3.500 M', 'Over $3.500 M']],
    rent: [['all', 'Cualquiera', 'Any'], ['0-5', 'Hasta $5 M / mes', 'Up to $5 M / mo'], ['5-10', '$5 – 10 M / mes', '$5 – 10 M / mo'], ['10-', 'Más de $10 M / mes', 'Over $10 M / mo']],
    stay: [['all', 'Cualquiera', 'Any'], ['0-1.5', 'Hasta $1,5 M / noche', 'Up to $1.5 M / night'], ['1.5-', 'Más de $1,5 M / noche', 'Over $1.5 M / night']]
  };
  var qOp = document.getElementById('qOp'), qType = document.getElementById('qType'), qZone = document.getElementById('qZone'), qBudget = document.getElementById('qBudget');

  function fillSelects() {
    qType.innerHTML = '<option value="all">' + S.t('search.any') + '</option>' + TYPES.map(function (t) { return '<option value="' + t + '">' + D.typeLabel(t) + '</option>'; }).join('');
    qZone.innerHTML = '<option value="all">' + S.t('search.any') + '</option>' + S.ZONES.map(function (z) { return '<option value="' + z.id + '">' + z.label + '</option>'; }).join('');
    qBudget.innerHTML = BUDGETS[state.mode].map(function (b) { return '<option value="' + b[0] + '">' + (S.lang === 'en' ? b[2] : b[1]) + '</option>'; }).join('');
    qOp.value = state.mode; qType.value = state.type; qZone.value = state.zone; qBudget.value = state.budget;
    document.getElementById('qGo').innerHTML = S.icon('search') + ' ' + S.t('search.go');
  }

  function inBudget(l) {
    if (state.budget === 'all') return true;
    var parts = state.budget.split('-'), lo = parseFloat(parts[0]) || 0, hi = parts[1] === '' ? Infinity : parseFloat(parts[1]);
    var v = S.priceCOP(l) / (state.mode === 'buy' ? 1e6 : 1e6);
    return v >= lo && v < hi;
  }
  function filtered() {
    return pub.filter(function (l) {
      return S.modeOf(l) === state.mode && (state.zone === 'all' || S.zoneOf(l) === state.zone) && (state.type === 'all' || l.type === state.type) && inBudget(l);
    });
  }
  function renderGallery() {
    var list = filtered();
    var grid = document.getElementById('galGrid');
    grid.innerHTML = list.length ? list.map(S.listingCard).join('') :
      '<div class="dz-empty">' + S.icon('leaf') + '<p>' + S.t('gal.empty') + '</p><button type="button" class="btn btn-secondary" id="clearBtn">' + S.t('gal.clear') + '</button></div>';
    var clr = document.getElementById('clearBtn'); if (clr) clr.onclick = function () { state.zone = 'all'; state.type = 'all'; state.budget = 'all'; fillSelects(); renderZones(); renderGallery(); };
    document.getElementById('galCount').textContent = list.length + (S.lang === 'en' ? (list.length === 1 ? ' property' : ' properties') : (list.length === 1 ? ' inmueble' : ' inmuebles'));
    document.querySelectorAll('#galTabs .tab').forEach(function (t) { t.classList.toggle('is-active', t.dataset.mode === state.mode); t.setAttribute('aria-selected', t.dataset.mode === state.mode); });
  }
  function renderZones() {
    var counts = {}; pub.forEach(function (l) { if (S.modeOf(l) === state.mode) { var z = S.zoneOf(l); counts[z] = (counts[z] || 0) + 1; } });
    var el = document.getElementById('galZones');
    el.innerHTML = '<button type="button" class="chip' + (state.zone === 'all' ? ' is-active' : '') + '" data-zone="all">' + S.t('gal.all') + '</button>' +
      S.ZONES.map(function (z) { return '<button type="button" class="chip' + (state.zone === z.id ? ' is-active' : '') + '" data-zone="' + z.id + '"' + (counts[z.id] ? '' : ' style="opacity:.55"') + '>' + z.label + ' <span class="xs muted">' + (counts[z.id] || 0) + '</span></button>'; }).join('');
    el.querySelectorAll('.chip').forEach(function (c) { c.onclick = function () { state.zone = c.dataset.zone; qZone.value = state.zone; renderZones(); renderGallery(); }; });
  }
  document.querySelectorAll('#galTabs .tab').forEach(function (t) {
    t.addEventListener('click', function () { state.mode = t.dataset.mode; state.budget = 'all'; fillSelects(); renderZones(); renderGallery(); });
  });
  qOp.addEventListener('change', function () { state.mode = qOp.value; state.budget = 'all'; fillSelects(); renderZones(); renderGallery(); });
  qType.addEventListener('change', function () { state.type = qType.value; renderGallery(); });
  qZone.addEventListener('change', function () { state.zone = qZone.value; renderZones(); renderGallery(); });
  qBudget.addEventListener('change', function () { state.budget = qBudget.value; renderGallery(); });
  document.getElementById('quickSearch').addEventListener('submit', function (e) {
    e.preventDefault(); renderGallery();
    document.getElementById('inmuebles').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  // footer "Compra / Arriendo / Vacacional" links pick the tab
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-mode]'); if (!a) return;
    state.mode = a.dataset.mode; state.budget = 'all'; fillSelects(); renderZones(); renderGallery();
  });

  /* ---- collections ---- */
  var COLS = [
    { key: 'lake', icon: 'waves', pick: function (l) { return S.zoneOf(l) === 'guatape'; } },
    { key: 'finca', icon: 'tree', pick: function (l) { return l.type === 'finca' || (S.zoneOf(l) === 'oriente' && l.type === 'casa'); } },
    { key: 'med', icon: 'building', pick: function (l) { return S.zoneOf(l) === 'medellin' && l.type !== 'oficina'; } }
  ];
  function renderCollections() {
    document.getElementById('collections').innerHTML = COLS.map(function (c) {
      var items = pub.filter(c.pick);
      return '<div class="dz-collection"><div class="dz-collection-intro">' + S.icon(c.icon) + '<h3>' + S.t('col.' + c.key) + '</h3><p class="muted">' + S.t('col.' + c.key + '.d') + '</p><span class="dz-count">' + items.length + (S.lang === 'en' ? ' properties' : ' inmuebles') + '</span></div>' +
        '<div class="dz-strip">' + items.map(S.listingCard).join('') + '</div></div>';
    }).join('');
  }

  /* ---- lifestyle teaser ---- */
  function renderLifestyle() {
    document.getElementById('lsServices').innerHTML = D.lifestyle.slice(0, 6).map(function (s) {
      var t = S.ls(s);
      return '<div class="dz-service">' + S.icon(S.iconFor[s.id] || 'leaf') + '<div><b>' + S.esc(t.name) + '</b><p>' + S.esc(t.desc) + '</p></div><span class="pill ' + (s.status === 'pilot' ? 'pill-success' : 'pill-accent') + '">' + S.t(s.status === 'pilot' ? 'ls.pilot' : 'ls.soon') + '</span></div>';
    }).join('');
  }

  /* ---- divisions ---- */
  var DIV_ES = {
    'real-estate': 'Propiedades excepcionales con el sello Dorum: casas de lujo, fincas de alto valor paisajístico, lotes con vista al embalse y oportunidades de desarrollo.',
    'lifestyle': 'Experiencias turísticas y administración de rentas: convertimos compras en activos productivos.',
    'projects': 'Diseño y construcción de casas sostenibles que unen naturaleza, sostenibilidad y tecnología.',
    'foundation': 'Programas comunitarios y de conservación alrededor del embalse.',
    'boutique': 'Objetos curados para vivir inmerso en la naturaleza.'
  };
  function renderDivisions() {
    document.getElementById('divTag').textContent = S.lang === 'en' ? D.tenant.tagline : D.tenant.taglineEs;
    document.getElementById('divisions').innerHTML = D.tenant.divisions.map(function (dv, i) {
      var href = dv.id === 'lifestyle' || dv.id === 'projects' ? 'lifestyle.html' : '#inmuebles';
      return '<a class="dz-division' + (i === 0 ? ' is-main' : '') + '" href="' + href + '" style="text-decoration:none;color:inherit">' + S.icon(S.iconFor[dv.id]) + '<h3>' + S.esc(dv.name) + '</h3><p>' + S.esc(S.lang === 'en' ? dv.desc : DIV_ES[dv.id]) + '</p></a>';
    }).join('');
  }

  /* ---- team ---- */
  function renderTeam() {
    var owner = D.usersByRole('owner')[0] || {};
    document.getElementById('ownerCard').innerHTML =
      '<span class="avatar avatar-accent">' + S.esc(owner.initials || S.initials(D.OWNER_NAME)) + '</span>' +
      '<div><p class="eyebrow">' + S.t('team.owner') + ' · ' + S.esc(owner.title || '') + '</p><h3 class="display" style="font-size:var(--fs-2xl);margin-top:var(--s-1)">' + S.esc(D.OWNER_NAME) + '</h3></div>' +
      '<blockquote>“' + S.esc(S.lang === 'en' ? D.tenant.tagline : D.tenant.taglineEs) + '.” <span class="muted" style="font-style:normal;font-family:var(--font-ui);font-size:var(--fs-sm)">— ' + S.esc(D.tenant.instagramLine) + '</span></blockquote>' +
      '<p class="small muted">' + S.esc(S.lang === 'en' ? D.tenant.positioning : D.tenant.positioningEs) + '</p>';
    document.getElementById('brokers').innerHTML = D.usersByRole('broker').map(function (u) {
      return '<div class="dz-broker"><span class="avatar">' + S.esc(u.initials) + '</span><div><b>' + S.esc(u.name) + '</b><small>' + S.esc(u.title) + '</small><small>' + S.esc(u.city) + ' · ' + u.langs.map(function (x) { return x.toUpperCase(); }).join(' / ') + '</small></div>' +
        '<div class="row"><a class="btn btn-secondary btn-sm" href="' + S.wa('Hola ' + u.name.split(' ')[0] + ', quiero información sobre inmuebles Dorum.', u.phone) + '" target="_blank" rel="noopener">' + S.icon('chat') + ' WhatsApp</a></div></div>';
    }).join('');
    document.getElementById('markets').innerHTML = D.tenant.markets.map(function (m) { return '<li>' + S.icon('pin') + S.esc(m) + '</li>'; }).join('');
    document.getElementById('offices').innerHTML = D.tenant.offices.map(function (o) { return '<li>' + S.icon('building') + S.esc(o.name) + ' <span class="muted">· ' + S.esc(o.barrio) + '</span></li>'; }).join('');
  }

  /* ---- testimonials (invented, marked demo) ---- */
  var TESTI = [
    { q: 'Compramos el lote pensando en descansar y terminamos con una casa que se paga sola. El extracto mensual llega puntual y la casa siempre está impecable.', qEn: 'We bought the lot to unwind and ended up with a house that pays for itself. The monthly statement arrives on time and the house is always spotless.', n: 'Familia inversionista · Medellín', nEn: 'Investor family · Medellín', s: 'Programa Lifestyle · Guatapé', sEn: 'Lifestyle programme · Guatapé' },
    { q: 'Cerramos desde Toronto sin una sola sorpresa. Cada documento estaba listo antes de pedirlo y el equipo hablaba nuestro idioma, literalmente.', qEn: 'We closed from Toronto without a single surprise. Every document was ready before we asked, and the team spoke our language — literally.', n: 'Compradora internacional · Toronto', nEn: 'International buyer · Toronto', s: 'Casa de lago · Guatapé', sEn: 'Lake house · Guatapé' },
    { q: 'Dorum entendió que no vendíamos una finca, sino la memoria de tres generaciones. La presentaron con el respeto que merecía y se vendió en seis semanas.', qEn: 'Dorum understood we were not selling a finca but the memory of three generations. They presented it with the respect it deserved and it sold in six weeks.', n: 'Vendedores · Llanogrande', nEn: 'Sellers · Llanogrande', s: 'Finca en el Oriente Antioqueño', sEn: 'Finca in the Oriente Antioqueño' }
  ];
  function renderTesti() {
    var en = S.lang === 'en';
    document.getElementById('testimonials').innerHTML = TESTI.map(function (t, i) {
      return '<figure class="dz-testimonial"><span class="pill">' + S.t('lf.demo') + '</span>' + S.icon('quote') + '<p>' + S.esc(en ? t.qEn : t.q) + '</p><footer><span class="avatar avatar-sand avatar-sm">' + (i + 1) + '</span><div>' + S.esc(en ? t.nEn : t.n) + '<small>' + S.esc(en ? t.sEn : t.s) + '</small></div></footer></figure>';
    }).join('');
  }

  /* ---- contact ---- */
  document.getElementById('contactForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('cName').value.trim();
    D.toast(S.t('toast.ok'), (name ? name + ' · ' : '') + S.t('toast.ok.body'), 'success');
    e.target.reset();
  });

  /* ---- render all; re-render on language change ---- */
  function renderAll() {
    renderHero(); fillSelects(); renderZones(); renderGallery(); renderCollections(); renderLifestyle(); renderDivisions(); renderTeam(); renderTesti();
    document.getElementById('formNote').innerHTML = S.icon('sparkles') + '<span>' + S.t('ct.note') + '</span>';
  }
  document.addEventListener('dorum:lang', renderAll);
  renderAll();
})();
</script>
</body>
</html>
